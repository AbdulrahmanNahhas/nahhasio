[package]
name = "nahhasio-linux"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
native-diagnostics = ["media-transfer/test-fixtures", "dep:tempfile"]

[dependencies]
native_player = { package = "nahhasio-native-player", path = "../../crates/native-player" }
sha2.workspace = true
hex.workspace = true
regex = "1"
media-transfer = { path = "../../crates/media-transfer" }
axum.workspace = true
getrandom.workspace = true
subtle.workspace = true
tokio-stream = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = { version = "3", optional = true }
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_4"] }
webkit6 = "0.5"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
base64 = "0.22"
url = "2"

[lints]
workspace = true
