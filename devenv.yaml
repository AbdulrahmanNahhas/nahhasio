# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
# Shared reviewed baseline; update revisions deliberately, then regenerate devenv.lock.
inputs:
  devenv:
    url: github:cachix/devenv/9b375a0819b225176316f6e05927c569598dce7a?dir=src/modules
  nixpkgs:
    url: github:NixOS/nixpkgs/5adc50831c259f87faeb09ddf930d43597197473
  rust-overlay:
    url: github:oxalica/rust-overlay/83dd732f2428827f35d997deae108a2ced5125f4
    inputs:
      nixpkgs:
        follows: nixpkgs

require_version: ">=2.4"

# DATABASE_URL uses a fixed port; fail if it is occupied instead of choosing another.
strict_ports: true
