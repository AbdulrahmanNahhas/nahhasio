name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:23102/arcadia
  ARCADIA_SEED_DEMO_ACCOUNTS: "true"
  NODE_ENV: test

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arcadia
        ports:
          - 23102:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install native development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev libmpv-dev libtorrent-rasterbar-dev libboost-dev cmake

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate

      # Database fixtures use demo accounts and seeded vocabularies.
      # (ARCADIA_SEED_DEMO_ACCOUNTS=true above). Local `devenv up` never seeds the catalog.
      - name: Seed the test database
        run: pnpm db:seed

      # New source is checked with Oxlint, shadcn rules, and Oxfmt.
      - name: Lint
        run: pnpm lint && pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Rust format + clippy
        run: pnpm check:rust

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install browser test runtime
        run: pnpm --filter @nahhasio/linux-ui exec playwright install --with-deps chromium

      - name: Linux browser journeys
        run: |
          pnpm --filter @nahhasio/linux-ui test:e2e
          pnpm --filter @nahhasio/linux-ui test:e2e:player
