name: Linux AppImage

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Install the pinned development environment runner
        run: nix profile install github:cachix/devenv/30ef5a2458f270574726efe3574e5eb7e731f647
      - name: Build desktop and runtime closure
        run: devenv shell -- bash bin/nahhasio-appimage
      - uses: actions/upload-artifact@v4
        with:
          name: Nahhasio-Linux-x86_64
          path: |
            dist/client/*.AppImage
            dist/client/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: appimage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nahhasio-Linux-x86_64
          path: artifacts
      - name: Create a draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --draft --prerelease --title "Nahhasio $RELEASE_TAG" --generate-notes
