name: Nahhasio release preparation

on:
  workflow_dispatch:
    inputs:
      version:
        description: Nahhasio version (must match the Rust and client package versions)
        required: true
        default: "0.2.0"
  push:
    tags: ["nahhasio-v*"]

permissions:
  contents: read

concurrency:
  group: nahhasio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          HAS_FLATPAK_KEY: ${{ secrets.NAHHASIO_FLATPAK_GPG_KEY != '' }}
          FLATPAK_FINGERPRINT: ${{ vars.NAHHASIO_FLATPAK_GPG_FINGERPRINT }}
        run: |
          python3 - <<'PY'
          import ast, json, os, re, tomllib, runpy
          if os.environ.get("HAS_FLATPAK_KEY") != "true" or not re.fullmatch(r"[A-F0-9]{40,64}", os.environ.get("FLATPAK_FINGERPRINT", "")):
              raise SystemExit("Configure NAHHASIO_FLATPAK_GPG_KEY secret and NAHHASIO_FLATPAK_GPG_FINGERPRINT variable before building")
          version = os.environ.get("REQUESTED_VERSION") or os.environ["GITHUB_REF_NAME"].removeprefix("nahhasio-v")
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit("Use a numbered release version without a prerelease suffix")
          with open("Cargo.toml", "rb") as stream:
              if tomllib.load(stream)["workspace"]["package"]["version"] != version:
                  raise SystemExit("Rust workspace version mismatch")
          for path in ("package.json", "apps/linux/ui/package.json"):
              with open(path) as stream:
                  if json.load(stream)["version"] != version:
                      raise SystemExit(f"Version mismatch: {path}")
          tree = ast.parse(open("packaging/operations/operations.py").read())
          host_version = next(ast.literal_eval(item.value) for item in tree.body if isinstance(item, ast.Assign) and any(isinstance(target, ast.Name) and target.id == "HOST_TOOLS_VERSION" for target in item.targets))
          if host_version != version:
              raise SystemExit("Host maintenance tools version mismatch")
          channel = runpy.run_path("packaging/release/manifest.py")["release_channel"](version)
          if json.load(open("packaging/flatpak/io.nahhasio.Linux.json"))["default-branch"] != channel:
              raise SystemExit("Flatpak branch does not match the release channel")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
              output.write(f"channel={channel}\n")
          PY
  server:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and publish digest-qualified server image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/${GITHUB_REPOSITORY,,}/nahhasio-server"
          podman pull docker.io/library/rust:1.94-bookworm
          podman pull docker.io/library/debian:bookworm-slim
          podman pull ghcr.io/denoland/deno:bin-2.9.7
          rust_image=$(podman image inspect docker.io/library/rust:1.94-bookworm --format '{{index .RepoDigests 0}}')
          runtime_image=$(podman image inspect docker.io/library/debian:bookworm-slim --format '{{index .RepoDigests 0}}')
          deno_image=$(podman image inspect ghcr.io/denoland/deno:bin-2.9.7 --format '{{index .RepoDigests 0}}')
          podman build --file packaging/server/Containerfile --build-arg "RUST_IMAGE=$rust_image" --build-arg "RUNTIME_IMAGE=$runtime_image" --build-arg "DENO_IMAGE=$deno_image" --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$repository:$RELEASE_VERSION" .
          image="$repository:$RELEASE_VERSION"
          expected_schema=$(python3 packaging/release/manifest.py --fingerprint)
          podman run --rm --network=none --entrypoint /bin/sh "$image" -ec '
            test "$(id -u)" = 10001
            test -x /usr/local/bin/nahhasio-server
            test -x /usr/local/bin/nahhasio-media-worker
            test "$(nahhasio --version)" = "nahhasio $1"
            nahhasio migrate fingerprint --json | python3 -c '"'"'import json, sys; assert json.load(sys.stdin)["schemaVersion"] == sys.argv[1]'"'"' "$2"
            yt-dlp --version
            deno --version
            ffprobe -version
          ' smoke "$RELEASE_VERSION" "$expected_schema"
          mkdir -p dist/release
          podman push --digestfile dist/release/server.digest "$image"
          printf '%s@%s\n' "$repository" "$(cat dist/release/server.digest)" > dist/release/server-image.txt
          printf '%s\n%s\n%s\n' "$rust_image" "$runtime_image" "$deno_image" > dist/release/build-bases.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nahhasio-server-release
          path: dist/release/*
  client-sources:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.94.0
      - name: Prepare UI and verified offline sources
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nahhasio/linux-ui build
          python3 packaging/flatpak/prepare.py
          mkdir -p dist
          tar -I 'zstd -T0' -cf dist/flatpak-sources.tar.zst .flatpak/source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nahhasio-flatpak-sources
          path: dist/flatpak-sources.tar.zst
          compression-level: 0
  client:
    needs: [version, client-sources]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77 # gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nahhasio-flatpak-sources
          path: dist
      - name: Unpack offline sources
        run: tar -I zstd -xf dist/flatpak-sources.tar.zst
      - name: Restore Flatpak build stages and compiler cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .flatpak/builder
          key: nahhasio-gnome50-x86_64-${{ hashFiles('packaging/flatpak/io.nahhasio.Linux.json', 'packaging/flatpak/python-sources.json', 'Cargo.lock', '.github/workflows/nahhasio-release.yml') }}
          restore-keys: |
            nahhasio-gnome50-x86_64-
            nahhasio-gnome50-
      - name: Build client against the GNOME runtime
        env:
          RELEASE_CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          # The SDK update can hit EXDEV on the container's preinstalled system Flatpak tree.
          export FLATPAK_USER_DIR="$GITHUB_WORKSPACE/.flatpak/runtime"
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          xvfb-run --auto-servernum flatpak-builder \
            --user --install-deps-from=flathub --disable-rofiles-fuse \
            --repo=dist/flatpak-repo --force-clean --arch=x86_64 \
            --default-branch="$RELEASE_CHANNEL" --subject="Built from $GITHUB_SHA" \
            --ccache --state-dir=.flatpak/builder \
            .flatpak/build packaging/flatpak/io.nahhasio.Linux.json
      - name: Export unsigned repository for the isolated signing job
        run: tar -I 'zstd -T0 -1' -cf dist/unsigned-flatpak-repo.tar.zst dist/flatpak-repo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nahhasio-client-release
          path: dist/unsigned-flatpak-repo.tar.zst
          compression-level: 0
  draft:
    needs: [version, server, client]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nahhasio-*-release
          merge-multiple: true
          path: dist
      - name: Sign release and prepare install bundle
        env:
          SIGNING_KEY: ${{ secrets.NAHHASIO_RELEASE_SIGNING_KEY }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.version.outputs.channel }}
          NAHHASIO_FLATPAK_GPG_KEY: ${{ secrets.NAHHASIO_FLATPAK_GPG_KEY }}
          NAHHASIO_FLATPAK_GPG_FINGERPRINT: ${{ vars.NAHHASIO_FLATPAK_GPG_FINGERPRINT }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak ostree zstd
          bash packaging/release/sign-flatpak.sh
          mv dist/server-image.txt dist/build-bases.txt dist/server.digest dist/release/
          test -n "$SIGNING_KEY"
          umask 077
          key="$RUNNER_TEMP/nahhasio-release-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          image="dist/release/Nahhasio-$RELEASE_VERSION-x86_64.flatpak"
          tar --exclude=__pycache__ --exclude='*.pyc' -czf dist/release/nahhasio-install.tar.gz bin/nahhasio-server-install bin/nahhasio-client-install bin/nahhasio-transfer packaging/server packaging/operations packaging/flatpak/install.py packaging/flatpak/README.md packaging/release/manifest.py docs/operations/deployment.md
          python3 packaging/release/manifest.py --version "$RELEASE_VERSION" --client "$image" --client-url "https://github.com/$GITHUB_REPOSITORY/releases/download/nahhasio-v$RELEASE_VERSION/$(basename "$image")" --server-image "$(cat dist/release/server-image.txt)" --installer-bundle dist/release/nahhasio-install.tar.gz --installer-url "https://github.com/$GITHUB_REPOSITORY/releases/download/nahhasio-v$RELEASE_VERSION/nahhasio-install.tar.gz" --signing-key "$key" --flatpak-key dist/release/flatpak-key.gpg --flatpak-fingerprint "$NAHHASIO_FLATPAK_GPG_FINGERPRINT" --flatpak-repo dist/release/flatpak-repository.tar.gz --repository-url "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/$(test "$RELEASE_CHANNEL" = rc && echo flatpak-rc || echo flatpak)/"
          openssl pkeyutl -sign -rawin -inkey "$key" -in dist/release/nahhasio-install.tar.gz | base64 -w0 > dist/release/nahhasio-install.tar.gz.sig
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "nahhasio-v$RELEASE_VERSION" dist/release/* --target "$GITHUB_SHA" --draft --title "Nahhasio $RELEASE_VERSION" --generate-notes
