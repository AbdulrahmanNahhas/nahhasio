[workspace]
resolver = "3"
members = [
  "apps/linux",
  "apps/server",
  "crates/catalog-core",
  "crates/cli",
  "crates/client-core",
  "crates/media-transfer",
  "crates/native-player",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
axum = "0.8.9"
getrandom = "0.4"
hex = "0.4"
rustix = { version = "1", features = ["fs", "process"] }
scrypt = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = [
  "json",
  "postgres",
  "runtime-tokio",
] }
subtle = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

# GTK's generated bindings are large; keep local builds within laptop memory.
[profile.dev]
debug = 0
# Incremental snapshots previously consumed over 5 GiB in this workspace.
incremental = false
